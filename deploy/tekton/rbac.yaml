apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-mcp-pipeline
  # Attach a docker-registry pull/push secret here in production:
  # secrets:
  #   - name: registry-creds
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-mcp-pipeline
rules:
  # Tekton creates PVCs for workspaces and pods to run the steps.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "configmaps", "secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns", "pipelineruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-mcp-pipeline
subjects:
  - kind: ServiceAccount
    name: backstage-mcp-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-mcp-pipeline
