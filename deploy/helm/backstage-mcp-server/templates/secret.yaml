{{/*
Inline Secret rendered only when the user supplies tokens inline. In production
you should reference an existing Secret via .Values.config.*.existingSecret.
*/}}
{{- $needsBackstage := and .Values.config.backstage.token (not .Values.config.backstage.existingSecret) -}}
{{- $needsOpenAI := and .Values.config.openai.apiKey (not .Values.config.openai.existingSecret) -}}
{{- if or $needsBackstage $needsOpenAI -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backstage-mcp-server.fullname" . }}
  labels:
    {{- include "backstage-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needsBackstage }}
  backstage-token: {{ .Values.config.backstage.token | quote }}
  {{- end }}
  {{- if $needsOpenAI }}
  openai-api-key: {{ .Values.config.openai.apiKey | quote }}
  {{- end }}
{{- end -}}
